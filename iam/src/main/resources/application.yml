server:
  port: 8090

keycloak:
  admin:
    # Internal Docker-network address — this service and keycloak share
    # the same compose network (see ../docker/docker-compose.yml).
    server-url: http://keycloak:8080
    # client_credentials, not the bootstrap admin's username/password —
    # production can't ship a human admin's password in config. The
    # iam-service client itself (master realm, service account granted
    # master's "admin" composite role) is provisioned once via
    # ../scripts/create-iam-client.sh, not created by this app at
    # startup. No default here deliberately — this must come from the
    # KEYCLOAK_ADMIN_CLIENT_SECRET env var (set in docker-compose.yml for
    # local dev, a real secrets store everywhere else) rather than a
    # plaintext value in this file, which would otherwise end up in git
    # history the moment this repo is pushed.
    realm: master
    client-id: iam-service
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

highwire:
  auth:
    # Local JWT verification, not introspection — see auth-sdk's
    # JwtAuthConfig/RealmResolvingJwtDecoder. Reuses keycloak.admin.*
    # above by reference rather than repeating the same secret a second
    # time — it's the same master-realm, cross-realm-admin credential,
    # now also used by auth-sdk to fetch each realm's signing keys via
    # the Admin REST API. No client registered into every realm anymore;
    # scripts/<realm>/05-create-introspection-client.sh is gone.
    keycloak-url: http://keycloak:8080
    admin-realm: ${keycloak.admin.realm}
    admin-client-id: ${keycloak.admin.client-id}
    admin-client-secret: ${keycloak.admin.client-secret}
    # resource-server-client-id and decision-cache-ttl-seconds are
    # deliberately absent: iam-service has no @PreAuthorize("hasPermission(...)")
    # checks of its own, so there's no real resource-server clientId to
    # put here — see AuthSdkProperties for what these mean when a future
    # service actually needs them. (Live-verified end-to-end against a
    # real nejm-journal-api test client before being reverted here —
    # AuthorizationCheckService/KeycloakPermissionEvaluator do work.)

spring:
  application:
    # The "application" label Micrometer stamps on every metric this
    # service exports — Grafana dashboard 17175's $app_name variable and
    # every panel query filter on this exact label; without it they'd
    # all come back empty.
    name: iam-service
  data:
    redis:
      # Docker-network address — see ../docker/docker-compose.yml's
      # dragonfly service. Same convention as keycloak-url above: this
      # service only ever runs inside that compose network.
      host: dragonfly
      port: 6379

management:
  endpoints:
    web:
      exposure:
        # prometheus: scraped by the prometheus service, unauthenticated
        # (see SecurityConfig's permitAll for this path) — matches how
        # Prometheus itself has no way to carry our bearer tokens anyway.
        include: health,prometheus
  metrics:
    tags:
      # NOT automatic — Micrometer doesn't stamp this by itself, confirmed
      # against dashboard 17175's own panel queries, which all filter on
      # application="$app_name". Without this line every one of them
      # would come back empty despite /actuator/prometheus working fine.
      application: ${spring.application.name}

logging:
  level:
    # Explicit, not relying on Spring Boot's INFO default, so every
    # AccessLogFilter / KeycloakGatewayImpl / GlobalExceptionHandler line
    # (see auth-sdk's Loggers) shows up in the container's stdout —
    # Promtail ships stdout straight into Loki, so this IS what ends up
    # queryable from the Service Logs dashboard.
    org.highwire: debug
  pattern:
    # requestId first — RequestCorrelationFilter puts it in MDC before
    # anything else runs, so every line for one request (including the
    # AccessLogFilter line that closes it) can be grepped/LogQL-filtered
    # by it.
    console: "%d{HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n"
