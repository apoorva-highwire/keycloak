# HighWire custom message keys (everything else falls back to Keycloak's
# built-in base theme messages via parent=keycloak).

# Overrides of Keycloak's own default copy, to match the reference design.
# login.ftl picks one of these three depending on realm config:
#   !loginWithEmailAllowed        → username   (realm doesn't take email at all)
#   loginWithEmailAllowed,
#     !registrationEmailAsUsername → usernameOrEmail (realm takes either)
#   registrationEmailAsUsername    → email      (realm takes only email)
# Forcing all three to "Email Address" was wrong — a username-only realm
# would show a misleading label. Only usernameOrEmail is overridden now.
loginAccountTitle=Login to access your account
usernameOrEmail=Email address or username

hwLogInViaInstitution=Log in via your institution
hwAcceptTerms=I accept the
hwTermsLinkText=terms and conditions

# Marketing panel (template.ftl) — {0} is the realm display name / current year.
# Default tagline is platform-level copy (MPS Hosting itself), shown whenever
# a client hasn't set its own hwTagline — e.g. on the admin/platform realm,
# or any journal realm that hasn't been configured yet. A journal-specific
# realm overrides this via client.attributes.hwTagline instead.
hwWelcomeTo=Welcome to {0}
hwDefaultTagline=MPS Hosting is a publishing platform covering markup handling, search infrastructure, content synchronization, access control, and base-site delivery for new publishers.
hwVisitJournal=Visit Journal
hwForAuthors=For Authors
hwArticleGuidelines=Article Guidelines
hwDataGuidelines=Data Guidelines
hwForReviewers=For Reviewers
hwReviewerGuidelines=Reviewer Guidelines
hwFeedback=Feedback
hwHelp=Help
hwPrivacyPolicy=Privacy Policy
hwFooterCopyright=© {0} HighWire Press, Inc. All rights reserved.

# Platform capability highlights — shown instead of the For Authors/For
# Reviewers cards when no journal-specific client attributes are configured
# (i.e. this is a platform-level login, not a single journal's reader login).
# These six are the ones the platform description above itself calls out
# (markup handling → content workflow, search infrastructure → content
# discovery, content synchronization → content engagement, access control,
# base-site delivery → site administration) plus analytics as the sixth
# load-bearing category from the full feature catalog.
hwCapContentWorkflow=Content Workflow
hwCapAccessIdentity=Access & Identity
hwCapContentDiscovery=Content Discovery
hwCapContentEngagement=Content Engagement
hwCapAnalytics=Analytics
hwCapSiteAdministration=Site Administration

# "OR CONTINUE WITH" divider above social/identity-provider login buttons
hwOrContinueWith=Or continue with
hwCreateAccount=Create an account
hwShowPassword=Show password
hwHidePassword=Hide password
