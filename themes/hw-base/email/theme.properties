parent=keycloak
import=common/keycloak
locales=en

# Only html/template.ftl is overridden here — every individual email
# (password-reset.ftl, email-verification.ftl, email-test.ftl,
# identity-provider-link.ftl, etc.) is inherited unchanged from the parent
# keycloak base theme and automatically renders through OUR template.ftl's
# emailLayout macro, since FreeMarker's theme resolution walks the parent
# chain and finds the child's override first. This gives branded
# header/logo/footer on every email Keycloak sends without re-authoring each
# message's actual content.
#
# text/template.ftl is NOT overridden — plain-text emails have no branding
# surface by nature, so the parent's pass-through macro is already correct.
