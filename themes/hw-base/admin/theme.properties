# Keycloak 26's default admin console (keycloak.v2) is a built React SPA —
# same situation as the account console: CSS-only branding, no .ftl pages.
# There is deliberately no per-publisher admin theme — the admin console is
# staff-only (highwire-admin realm, per PUBLISHER-ADMIN-PANEL.md §2a), never
# shown to a publisher's readers, so one shared theme covers it.
