parent=keycloak.v3
import=common/keycloak

styles=css/account.css

# Keycloak 26's default account console (keycloak.v3) is a built React SPA,
# not FreeMarker templates — unlike the login theme, there are no .ftl pages
# to override here. Branding is CSS-only (this stylesheet, reusing the same
# --hw-* custom properties as the login theme) plus whatever the SPA exposes
# via theme.properties (logo, colors) in future Keycloak versions.
