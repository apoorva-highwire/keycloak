parent=hw-base
import=common/keycloak

# Reuses the same publisher-overrides.css as the login theme (../../login/resources/css/) —
# Keycloak resolves it from the login theme's own resource path only, so this
# account theme ships its own copy that just re-declares the same --hw-* values.
# Keep both files' variable values identical for one publisher; see
# themes/README.md for the step to add a new publisher theme.
styles=css/account.css css/publisher-overrides.css
